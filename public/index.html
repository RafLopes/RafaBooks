<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RafaBooks</title>
  <meta name="description" content="Biblioteca pessoal de livros em PDF, resumos, ideias por tema e lições para a vida.">
  <meta name="theme-color" content="#12141b">
  <meta property="og:site_name" content="RafaBooks">
  <meta property="og:title" content="Uma lição para a vida · RafaBooks">
  <meta property="og:description" content="Ideias e passagens de livros transformadas em lições práticas, com exercícios e perguntas para refletir.">
  <meta property="og:type" content="article">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e3a857'/><path d='M7 9h7a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H7zM25 9h-5a3 3 0 0 0-3 3v12a2.5 2.5 0 0 1 2.5-2.5H25z' fill='%2312141b'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    // Aplica o tema salvo antes da pintura, evitando "piscar".
    try {
      const t = localStorage.getItem('rafabooks.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <nav id="nav" class="topbar" hidden></nav>
  <main id="view" class="container"></main>
  <nav id="tabbar" class="tabbar" hidden aria-label="Navegação principal"></nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
